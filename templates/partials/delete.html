<section class="panel form-panel">
  <div class="panel-heading"><div><h2>Excluir {{ entity.single }} #{{ record_id }}?</h2><p>Esta ação é permanente. Registros com dependências serão preservados.</p></div></div>
  <div class="form-body">
    {% set first = entity.fields.items() | first %}<p>{{ display(data[first[0]], first[1], relations) }}</p>
    <form method="post" action="{{ url(page, 'delete', record_id) }}"><input type="hidden" name="csrf" value="{{ csrf }}">
      <label class="checkbox"><input type="checkbox" name="confirm" value="yes" required> Confirmo que desejo excluir este registro.</label>
      <div class="form-actions"><a class="button secondary" href="{{ url(page) }}">Cancelar</a><button class="button danger">Confirmar exclusão</button></div>
    </form>
  </div>
</section>
