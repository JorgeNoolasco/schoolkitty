<section class="panel form-panel">
  <div class="panel-heading"><div><h2>{{ 'Editar' if action == 'edit' else 'Cadastrar' }} {{ entity.single }}</h2><p>Preencha com carinho. Todos os campos são obrigatórios.</p></div><img src="/static/img/bow.svg" width="44" height="34" alt=""></div>
  <form class="form-body" method="post" action="{{ url(page, action, record_id) }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="form-grid">
      {% for name, field in entity.fields.items() %}
      {% set value = form_value(data.get(name, '')) %}
      <label class="field" for="{{ name }}"><span>{{ field.label }} <span class="pink">*</span></span>
        {% if field.kind in ('relation', 'select') %}
        <select id="{{ name }}" name="{{ name }}" required><option value="">Selecione…</option>
          {% if field.kind == 'relation' %}
            {% for option, label in relations[field.relation].items() %}<option value="{{ option }}" {% if option == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
          {% else %}
            {% for option in field.options %}<option value="{{ option }}" {% if option == value %}selected{% endif %}>{{ option }}</option>{% endfor %}
          {% endif %}
        </select>
        {% if field.kind == 'relation' and not relations[field.relation] %}<small>Cadastre {{ field.relation }} pelo menu antes de continuar.</small>{% endif %}
        {% else %}
        <input id="{{ name }}" name="{{ name }}" type="{{ 'number' if field.kind in ('grade', 'hours', 'year') else field.kind }}" value="{{ value }}" required
          {% if field.kind in ('text', 'email') %}maxlength="100"{% endif %}
          {% if field.kind == 'grade' %}min="0" max="10" step="0.01"{% endif %}
          {% if field.kind == 'hours' %}min="0.01" max="99999999.99" step="0.01"{% endif %}
          {% if field.kind == 'year' %}min="1900" max="2100" step="1"{% endif %}
          {% if field.kind == 'tel' %}maxlength="20" placeholder="(11) 99999-9999"{% endif %}
          {% if name == 'data_nascimento' %}max="{{ today.isoformat() }}"{% endif %}>
        {% endif %}
      </label>
      {% endfor %}
    </div>
    <div class="form-actions"><a class="button secondary" href="{{ url(page) }}">Cancelar</a><button class="button" type="submit">Salvar {{ entity.single }} ♡</button></div>
  </form>
</section>
